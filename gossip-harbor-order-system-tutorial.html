:root{color-scheme:light;--paper:#f7f5ef;--ink:#102f35;--accent:#205b52;--muted:#637575}*{box-sizing:border-box}body{margin:0;background:#e8ece8;color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #d18b20;outline-offset:4px}.toolbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ink);color:white}.brand{font-size:15px;margin-right:auto}.toolbar button{background:transparent;color:white;border:1px solid #72898b;border-radius:5px;padding:8px 12px}.toolbar button:hover{background:#2c4d52}.toolbar button:disabled{opacity:.35;cursor:default}main{max-width:1440px;margin:24px auto;padding:0 24px}.slide{background:var(--paper);min-height:640px;aspect-ratio:16/9;padding:4.5% 5.6%;position:relative;box-shadow:0 8px 30px #102f3515;display:flex;flex-direction:column}.tag{font-size:clamp(12px,1.2vw,17px);text-transform:uppercase;letter-spacing:.07em;color:#39776e;font-weight:bold;margin:0 0 24px}h1{font-size:clamp(28px,3.2vw,46px);line-height:1.18;margin:0 0 42px;white-space:pre-line}.rows{display:grid;gap:28px;flex:1;align-content:space-evenly}.row{display:grid;grid-template-columns:30% 1fr;gap:4%}.row h2{font-size:clamp(18px,1.8vw,25px);line-height:1.32;color:var(--accent);margin:0;overflow-wrap:anywhere}.row p{font-size:clamp(18px,1.8vw,26px);line-height:1.4;margin:0}.page{text-align:right;color:var(--muted);font-size:13px;margin:20px 0 0}.cover{background:var(--ink);color:white;justify-content:center}.cover h1{font-size:clamp(40px,5vw,70px);margin:20px 0 42px}.cover .tag{color:#b9d4ce}.cover .subtitle{font-size:clamp(22px,2.4vw,32px);color:#dde9e5}.cover .scope{color:#b9d4ce;margin-top:50px;font-size:19px}.below{display:flex;justify-content:space-between;align-items:center;margin:18px 0;color:#536766;font-size:13px}.progress{height:4px;background:#cdd7d3}.progress div{height:100%;background:#39776e;transition:width .15s}.notes{background:white;padding:24px;margin:20px 0;line-height:1.6;border-left:4px solid #39776e}.notes h2{margin-top:0}.notes pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 Arial}.notes[hidden],.slide[hidden]{display:none}.index{position:fixed;inset:0;background:#102f3599;z-index:5;display:grid;place-items:center;padding:20px}.index[hidden]{display:none}.index-panel{background:var(--paper);width:min(800px,100%);max-height:85vh;overflow:auto;padding:30px;border-radius:8px}.index-top{display:flex;justify-content:space-between;align-items:center}.index-top button{padding:8px 12px}.index ol{padding-left:32px}.index li{margin:7px 0}.index li button{border:0;background:none;text-align:left;padding:7px;color:var(--ink);font-size:16px}.index li button:hover{text-decoration:underline}body:fullscreen main{max-width:1600px;margin:10px auto}.print-only{display:none}@media(max-width:750px){.toolbar{height:auto;min-height:64px;flex-wrap:wrap;padding:12px;gap:8px}.brand{width:100%}.toolbar button{font-size:13px;padding:7px 9px}main{padding:0 10px;margin:12px auto}.slide{aspect-ratio:auto;min-height:70vh;padding:28px 24px}h1{margin-bottom:28px}.rows{gap:25px}.row{grid-template-columns:1fr;gap:8px}.row h2{font-size:18px}.row p{font-size:19px}.below{align-items:start;gap:14px;line-height:1.5}.scope{line-height:1.5}}@media print{@page{size:landscape;margin:0}body{background:white}.toolbar,.below,.progress,.notes,.index{display:none!important}main{margin:0;padding:0;max-width:none}.slide,.slide[hidden]{display:flex!important;width:100vw;height:100vh;min-height:0;aspect-ratio:auto;box-shadow:none;break-after:page;padding:4% 5.6%}.slide:last-child{break-after:auto}h1{font-size:30pt;margin-bottom:25px}.row h2,.row p{font-size:17pt}.rows{gap:18px}.tag{font-size:11pt}.cover h1{font-size:46pt}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.parameter-table{border-collapse:collapse;width:100%;font-size:clamp(16px,1.4vw,20px);line-height:1.4;margin:0 0 20px;table-layout:fixed}
.parameter-table th,.parameter-table td{text-align:left;vertical-align:top;padding:15px 12px;border-bottom:1px solid #cbd6d0;overflow-wrap:anywhere}
.parameter-table th{color:#205b52;font-size:.9em;background:#e7eee7}
.parameter-table th:first-child,.parameter-table td:first-child{width:4%;padding-left:4px;padding-right:4px;color:#637575}
.data-slide .rows{display:none}.data-slide h1{margin-bottom:28px}.data-slide .page{margin-top:auto}

@media print{.parameter-table{font-size:13pt}.parameter-table th,.parameter-table td{padding:9px 8px}.takeaway{font-size:15pt}.data-slide h1{margin-bottom:20px}}


@media screen and (max-width:750px){
 .parameter-table,.parameter-table tbody,.parameter-table tr{display:block;width:100%}
 .parameter-table thead{display:none}
 .parameter-table tr{border-top:2px solid #cbd6d0;margin-bottom:22px}
 .parameter-table td,.parameter-table td:first-child{display:grid;grid-template-columns:38% 1fr;gap:12px;width:100%;padding:9px 3px;font-size:15px;border-bottom:1px solid #e2e7e1;color:#102f35}
 .parameter-table td::before{content:attr(data-label);font-weight:bold;color:#205b52}
}

.visual-slide h1{margin-bottom:20px}
.visual-slide .rows{display:none}
.visual-frame{margin:0;flex:1;min-width:0}
.visual-frame svg{display:block;width:100%;height:auto;max-height:440px}
.visual-caption{font-size:clamp(16px,1.45vw,21px);line-height:1.45;color:#205b52;margin-top:12px}
.visual-slide .page{margin-top:14px}
@media screen and (max-width:750px){
 .visual-frame{overflow-x:auto;padding-bottom:12px}
 .visual-frame svg{min-width:760px;max-height:none}

}
@media print{
 .visual-frame svg{max-height:365px}

}

<script id="deck-data" type="application/json">[{"title": "The order system", "tag": "System walkthrough", "rows": [], "note": "Step-by-step explanation of order generation, completion and configuration. Evidence context appears in the final reference section.", "src": ""}, {"title": "An order is a saved request", "tag": "Foundations", "rows": [["Slot", "The position owned by an order. The slot influences which creators can run."], ["Type and requirements", "The internal order type selects behavior. The request contains exact item codes."], ["Customer and metadata", "Avatar, order ID, difficulty-band metadata and optional gift information accompany the request."]], "note": "A slot number and an order type are different identifiers. An avatar is presentation data and should not be used alone to infer how the order was generated.", "src": "core/Board/Model/Order/MainOrderModel.lua:340; core/Board/Model/Order/MainOrder.lua"}, {"title": "Vocabulary used by the picker", "tag": "Foundations", "rows": [["Chain", "A merge progression containing successive item levels."], ["Candidate", "An item that the picker is considering for a request."], ["Requirement", "An exact item code included in the final saved order."], ["Creator and filter band", "A creator generates a type of order. A matching filter row supplies its allowed candidate ranges."]], "note": "A candidate may never become a displayed requirement because the final count draw can retain only a prefix of the candidate list.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:121,284,306"}, {"title": "Slot topology", "tag": "Foundations", "rows": [["Normal slots", "1 and 2 use Random1. Slot 3 uses Random2. Slots 4, 5 and 8 use Random3, Random4 and Random5New."], ["Dedicated positions", "6 special, 7 branch, 10 intimacy, 11 tutorial, 13 timed, 15 baseline, 17 lucky, 18 continuous and 19 extra customer."], ["Count and order", "The client declares SlotCount = 19. Creation scans numerically. UI display priority uses ht=\"400\" text-anchor=\"end\">3,000\u003c/text>\u003ctext x=\"640\" y=\"395\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#58706c\" font-weight=\"400\" text-anchor=\"start\">Item code\u003c/text>\u003c/svg>", "caption": "Separate scales: bar lengths cannot be compared across panels. DifficultyLevel is a third field: it controls candidate range checks, using chain level when no override exists."}}, {"title": "Item parameters: eligibility", "tag": "Foundations", "rows": [["UnlockLevel", "The player must reach the configured level."], ["ProgressUnlock", "When set to 1, the previous chain item must have been unlocked."], ["ForbiddenSlot", "A listed slot cannot request this item through the normal check."], ["Generator availability", "At least one generator for the chain must be unlocked. This check does not test its current cooldown."]], "note": "CheckItemCodeProgressUnlock returns false for an item missing from the item map. With ProgressUnlock enabled, chain level must exceed 1 and the preceding item must be unlocked. Generator ownership and readiness should not be substituted for the source IsUnlocked call.", "src": "core/Board/Model/Order/MainOrderModel.lua:741; core/Board/Model/Order/MainOrderCreatorRandom.lua:608"}, {"title": "Eligibility parameters: values and limits", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Parameter", "Observed bundled values", "Runtime check / missing value"], "rows": [["1", "UnlockLevel", "1–41 across 74 items", "Player level ≥ value. No upper clamp in this check. Missing value has no fallback."], ["2", "ProgressUnlock", "1 or absent", "Exactly 1 enables the previous-chain-item gate. Absent or another value bypasses it."], ["3", "ForbiddenSlot", "{10}, {10,11}, {11,18}, {10,11,18}, or absent", "Reject if the current slot is in the list. Missing means no exclusion by this field."]]}, "takeaway": "Observed values describe this table. They are not a complete schema of allowed values.", "note": "UnlockLevel exact observed set: 1,2,3,4,5,6,7,9,10,15,18,20,21,25,26,31,36,41. ForbiddenSlot lists occur 26,23,3,3 times respectively, with 19 missing. No empty lists occur in this default table. The consumer does not validate the slot list against an enum.", "src": "config/Data/Config/OrderItemConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:608; core/Board/Model/Order/MainOrderModel.lua:741"}, {"title": "A real item passing through the gates", "tag": "Worked example", "rows": [["Item 306", "UnlockLevel = 15, ProgressUnlock = 1, ForbiddenSlot = {10}, DifficultyLevel = 7."], ["Boundary checks", "Player level 14 fails. Level 15 passes only the level gate. An undiscovered previous item still blocks this candidate."], ["Slot and range", "Slot 10 rejects it. In an allowed slot, Max = 6 rejects it and Max = 7 admits it if every other gate also passes."]], "note": "Item 306: UnlockLevel = 15, ProgressUnlock = 1, ForbiddenSlot = {10}, DifficultyLevel = 7.\nBoundary checks: Player level 14 fails. Level 15 passes only the level gate. An undiscovered previous item still blocks this candidate.\nSlot and range: Slot 10 rejects it. In an allowed slot, Max = 6 rejects it and Max = 7 admits it if every other gate also passes.\n\nGenerator unlock, current exact-code demand, last-slot history and positive weight also apply. This is a controlled gate example, not an observed generated order.", "src": "config/Data/Config/OrderItemConfig.lua:151; core/Board/Model/Order/MainOrderCreatorRandom.lua:608,864; core/Board/Model/Order/MainOrderModel.lua:741", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"Item 306 requires player level at least15, previous item and generator unlocked, an allowed slot, no exact-code repeat, and difficulty maximum at least7.\">\u003ctitle>Candidate eligibility funnel\u003c/title>\u003cdesc>Item 306 requires player level at least15, previous item and generator unlocked, an allowed slot, no exact-code repeat, and difficulty maximum at least7.\u003c/desc>\u003crect x=\"35\" y=\"15\" width=\"670\" height=\"66\" rx=\"5\" fill=\"#dceae3\"/>\u003ctext x=\"370.0\" y=\"56\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">1  Player level ≥ 15\u003c/text>\u003ctext x=\"760\" y=\"55\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#287d71\" font-weight=\"400\" text-anchor=\"start\">Level 14 stops here\u003c/text>\u003cline x1=\"370\" y1=\"83\" x2=\"370\" y2=\"100\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 364 91 L 370 100 L 376 91\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003crect x=\"63\" y=\"103\" width=\"614\" height=\"66\" rx=\"5\" fill=\"#c5dfd3\"/>\u003ctext x=\"370.0\" y=\"144\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">2  Previous item + generator unlocked\u003c/text>\u003ctext x=\"760\" y=\"143\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#287d71\" font-weight=\"400\" text-anchor=\"start\">ProgressUnlock = 1\u003c/text>\u003cline x1=\"370\" y1=\"171\" x2=\"370\" y2=\"188\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 364 179 L 370 188 L 376 179\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003crect x=\"91\" y=\"191\" width=\"558\" height=\"66\" rx=\"5\" fill=\"#a8cfc0\"/>\u003ctext x=\"370.0\" y=\"232\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">3  Slot allowed + no exact-code repeat\u003c/text>\u003ctext x=\"760\" y=\"231\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#287d71\" font-weight=\"400\" text-anchor=\"start\">Slot 10 stops here\u003c/text>\u003cline x1=\"370\" y1=\"259\" x2=\"370\" y2=\"276\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 364 267 L 370 276 L 376 267\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003crect x=\"119\" y=\"279\" width=\"502\" height=\"66\" rx=\"5\" fill=\"#7fb5a3\"/>\u003ctext x=\"370.0\" y=\"320\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">4  Difficulty range includes 7\u003c/text>\u003ctext x=\"760\" y=\"319\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#287d71\" font-weight=\"400\" text-anchor=\"start\">Max 6 fails; Max 7 can pass\u003c/text>\u003ctext x=\"35\" y=\"399\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Item 306: base Weight 100. Every gate must pass before weighted selection.\u003c/text>\u003c/svg>", "caption": "Logical eligibility overview, not execution order. Funnel widths show stages, not measured candidate counts. Positive weight and all applicable gates must pass."}}, {"title": "Item parameters: preference and value", "tag": "Foundations", "rows": [["Weight and WeightMultiple", "Weight starts the lottery. WeightMultiple marks items used by the inventory/context weighting rules."], ["RepeatWeightDecrease", "A divisor reduces selection weight while that chain has an active repeat penalty."], ["Price and DiffScore", "Reward calculation and difficulty history read separate configured values."], ["RecommendedNumber / RecommendedPrice", "RecommendedNumber is both the baseline surplus threshold and requested quantity. RecommendedPrice can replace Price for each copy."]], "note": "RecommendedNumber is relevant to the baseline candidate pool. Avoid treating it as a universal requested quantity. Dynamic level limits belong to filter configuration, not the base Weight field.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:42,484,673; core/Board/Model/Order/MainOrder.lua:98"}, {"title": "Weight parameters: values and limits", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Parameter", "Observed bundled values", "Runtime check / missing value"], "rows": [["1", "Weight", "0 or 100", "Weight ≤ 0 excludes the item. Positive values have no upper cap in this candidate check. Missing has no fallback."], ["2", "WeightMultiple", "1 or absent", "Exactly 1 adds the item to the context-tracking pass. It is a flag, not the final multiplier."], ["3", "RepeatWeightDecrease", "10, 50 or 100", "Divides weight while a chain penalty exists. Missing adds no divisor. Zero is unsafe."]]}, "takeaway": "Weight 100 means relative weight, not a guaranteed request or a 100% chance.", "note": "73 base weights equal 100 and code 902 has Weight 0. WeightMultiple appears in 43 rows. RepeatWeightDecrease appears in 27 rows, nine per value. The division checks presence rather than validating positivity. A divisor >1 reduces weight, 1 preserves weight, and 0\u003cd\u003c1 increases it. Those latter settings are not observed defaults.", "src": "config/Data/Config/OrderItemConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:42,484,655"}, {"title": "Value and difficulty parameters", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Parameter", "Observed bundled values", "Runtime check / missing value"], "rows": [["1", "DifficultyLevel", "3–11 when present", "Overrides chain level. Missing uses chain level. The code does not clamp to 3–11."], ["2", "DiffScore", "2–3,000", "Sum per requirement. Missing DiffScore contributes nothing. No clamp in the sum."], ["3", "Price", "2–612", "Sum per requirement for normal base currency. No min/max clamp or missing-field fallback."]]}, "takeaway": "Example: item 209 has Price = 50 and DiffScore = 146. The two values serve different purposes.", "note": "DifficultyLevel appears in 18 rows, absent in 56. Price and DiffScore appear in all 74 rows. Code 215 has Price 612 and DiffScore 3000. Missing whole item configuration makes the price/difficulty method return zero. Observed extrema are not validated authoring limits.", "src": "config/Data/Config/OrderItemConfig.lua; core/Board/Model/Order/MainOrder.lua:98,341; core/Board/Model/Order/MainOrderCreatorRandom.lua:864"}, {"title": "Identifiers and baseline parameters", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Parameter", "Observed bundled values", "Runtime check / missing value"], "rows": [["1", "Code", "74 unique string identifiers", "Must resolve to item configuration. It is not a continuous numeric tuning range."], ["2", "RecommendedNumber", "1 or 2", "Baseline surplus threshold AND requested quantity. Missing excludes the item from this baseline pool."], ["3", "RecommendedPrice", "42–612", "Price per baseline copy. Missing falls back to Price. No clamp in the price consumer."]]}, "takeaway": "For authoring, use a positive integer quantity. The inspected baseline code does not enforce that schema for you.", "note": "RecommendedNumber appears in 14 rows: eleven with 1, three with 2. RecommendedPrice appears in the same 14 rows. Its observed set is 42, 58, 62, 86, 178, 202, 270, 304, 318, 406, 458, 612.", "src": "config/Data/Config/OrderItemConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:673,1055; core/Board/Model/Order/MainOrder.lua:98"}, {"title": "Player state changes the next order", "tag": "Foundations", "rows": [["Progress", "Current level, unlocked chain items and unlocked generators."], ["Possessions and demand", "Exact item counts on the board and in storage, plus requirements of active orders."], ["Saved history", "Completed difficulty, last order per slot, repeat counters, creation points and timers."], ["Conditions", "Monthly payment value where filters use it, and applicable activity or feature state."]], "note": "The normal count-map call is GetCodeCountMap(true, false, true): board and storage included, cache excluded. Two players with the same level and item configuration can therefore receive different orders.", "src": "core/Board/Model/Order/MainOrderModel.lua:738; core/Board/Model/Order/MainOrderCreatorRandom.lua:284,484"}, {"title": "When generation runs", "tag": "Generation", "rows": [["Initialization", "The model restores saved orders and attempts to fill eligible empty slots."], ["Completion", "Finishing an order immediately triggers another fill attempt."], ["Every second", "The model retries available slots, allowing cooldowns or changed conditions to take effect."]], "note": "SlotOrderModel scans in ascending order and repeats passes until no additions occur. Each successful order enters the active set before later slots evaluate. This means fill order can influence later candidate pools.", "src": "core/Board/Model/Order/SlotOrderModel.lua:7,22,57; core/Board/Model/Order/MainOrderModel.lua:248"}, {"title": "Creator priority comes before item picking", "tag": "Generation", "rows": [["First opportunities", "Fixed, then return-user free, then tutorial orders."], ["Activity opportunities", "Continuous orders, then Extra Customer, then Lucky."], ["Ordinary random path", "Random runs only when earlier creators return no order."]], "note": "Exact top-level sequence: MainOrderCreatorFixed, MainOrderCreatorReturnFree, MainOrderCreatorTutorial, MainOrderCreatorContiorders, MainOrderCreatorExtraCustomer, MainOrderCreatorLucky, MainOrderCreatorRandom. A surprising requirement can originate in another creator even when the slot looks familiar.", "src": "core/Board/Model/Order/MainOrderModel.lua:503"}, {"title": "Creation allowance and cooldowns", "tag": "Generation", "rows": [["Allowance", "Point defines the creation budget. Shared helper defaults to 1 when the field is absent."], ["Cooldown", "Exhaustion starts a timer. RefreshTime controls when an allowance becomes available again."], ["Exceptions", "Certain activities can force creation. Random1 shares state across slots 1 and 2 and accounts for active Random1 orders."]], "note": "Eligibility consumes a point before candidate creation finishes, so do not describe Point as a completed-order counter. Random2 can bypass its ordinary wait when no relevant other unfinished order exists. Timer zero, missing timer and elapsed timer follow different branches.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:3,79,899,950; core/Board/Model/Order/MainOrderDefinition.lua:84"}, {"title": "Normal creator settings", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Type / slots", "UnlockLevel", "RefreshTime", "Point / count weights"], "rows": [["1", "Random1 / 1, 2", "3", "3,600 s", "5 / 50, 50, 0"], ["2", "Random2 / 3", "3", "1,800 s", "Absent / 50, 50, 0"], ["3", "Random3 / 4", "4", "900 s", "Absent / 50, 50, 0"], ["4", "Random4 / 5", "5", "300 s", "Absent / 50, 50, 0"], ["5", "Random5New / 8", "10", "1,200 s", "Absent / 50, 50, 0"]]}, "takeaway": "Bundled settings. Missing Point becomes 1 in the shared helper. Count weights refer to one, two and three items.", "note": "Random1 uses separate shared-slot logic and accounts for existing Random1 orders. Do not read the refresh values as an unconditional delay after every order.", "src": "config/Data/Config/OrderRandomConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:79,899,950"}, {"title": "Other rows in the random configuration", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Type", "UnlockLevel", "RefreshTime", "Count weights"], "rows": [["1", "12 / intimacy", "14", "3,600 s", "Fallback table"], ["2", "15 / timed customer", "12", "1 s", "Fallback table"], ["3", "16 / timed order", "1", "1 s", "Fallback table"], ["4", "21 / extra customer", "10", "120 s", "100, 0, 0"]]}, "takeaway": "These are configuration rows. Each creator decides which fields it uses, so a one-second value does not prove a one-second refill.", "note": "Top-level observed RefreshTime set:1,120,300,900,1200,1800,3600 seconds. UnlockLevel set:1,3,4,5,10,12,14. Type values are enum IDs1,2,3,4,9,12,15,16,21, not every integer between1 and21. Point is explicitly5 only for Type1. No upper clamp is present in the inspected consumers.", "src": "config/Data/Config/OrderRandomConfig.lua:266; core/Board/Model/Order/MainOrderCreatorRandom.lua:1001,1019"}, {"title": "A 900-second cooldown example", "tag": "Worked example", "rows": [["Start condition", "Assume Random3 has no remaining allowance and no force-create override. The eligibility check starts its cooldown at server time T."], ["Before the boundary", "At T + 899 seconds, RefreshTime = 900 has not elapsed. Creation remains blocked by this cooldown."], ["At the boundary", "At T + 900, the helper can replenish the allowance. Other gates still apply, and eligibility spends a point before Create finishes."]], "note": "Start condition: Assume Random3 has no remaining allowance and no force-create override. The eligibility check starts its cooldown at server time T.\nBefore the boundary: At T + 899 seconds, RefreshTime = 900 has not elapsed. Creation remains blocked by this cooldown.\nAt the boundary: At T + 900, the helper can replenish the allowance. Other gates still apply, and eligibility spends a point before Create finishes.\n\nThe clock starts when exhausted allowance is checked. It is not necessarily the delivery timestamp. Point, DiffScore and currency are unrelated quantities. Example excludes force-create conditions.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:79", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"Random3 cooldown begins atT when exhausted allowance is checked. At899seconds it remains blocked. At900seconds allowance may replenish, subject to other gates.\">\u003ctitle>Cooldown boundary\u003c/title>\u003cdesc>Random3 cooldown begins atT when exhausted allowance is checked. At899seconds it remains blocked. At900seconds allowance may replenish, subject to other gates.\u003c/desc>\u003ctext x=\"35\" y=\"35\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"26\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">Random3: RefreshTime = 900 seconds\u003c/text>\u003cline x1=\"100\" y1=\"175\" x2=\"1100\" y2=\"175\" stroke=\"#c8d5ce\" stroke-width=\"8\"/>\u003cline x1=\"100\" y1=\"175\" x2=\"1000\" y2=\"175\" stroke=\"#c38a23\" stroke-width=\"8\"/>\u003cline x1=\"1000\" y1=\"175\" x2=\"1100\" y2=\"175\" stroke=\"#287d71\" stroke-width=\"8\"/>\u003ccircle cx=\"100\" cy=\"175\" r=\"11\" fill=\"#c38a23\" stroke=\"#c38a23\" stroke-width=\"3\"/>\u003ctext x=\"100\" y=\"133\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"25\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">T\u003c/text>\u003ccircle cx=\"720\" cy=\"175\" r=\"11\" fill=\"#c38a23\" stroke=\"#c38a23\" stroke-width=\"3\"/>\u003ctext x=\"720\" y=\"133\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"25\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">T + 899\u003c/text>\u003ccircle cx=\"1000\" cy=\"175\" r=\"11\" fill=\"#287d71\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"1000\" y=\"133\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"25\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">T + 900\u003c/text>\u003ctext x=\"55\" y=\"238\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Allowance exhausted\u003c/text>\u003ctext x=\"55\" y=\"272\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Eligibility check starts timer\u003c/text>\u003ctext x=\"600\" y=\"238\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Cooldown still blocks\u003c/text>\u003ctext x=\"895\" y=\"306\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#287d71\" font-weight=\"700\" text-anchor=\"start\">Allowance may refill\u003c/text>\u003ctext x=\"35\" y=\"370\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Delivery time does not automatically define T. Timeline spacing is schematic.\u003c/text>\u003c/svg>", "caption": "The boundary is inclusive: elapsed time ≥ 900. This example excludes force-create overrides and assumes other gates are checked separately."}}, {"title": "Difficulty-band selection", "tag": "Generation", "rows": [["Inputs", "Player level, accumulated completed DiffScore and monthly payment bounds where configured."], ["Selection rule", "Read the Filters list in order and take the first row that matches every specified bound."], ["Outputs", "FirstMin / FirstMax, SecondMin / SecondMax and ThirdMin / ThirdMax, plus optional dynamic ceilings."]], "note": "Bounds are inclusive in the source comparisons. Missing bounds do not constrain that dimension. Do not describe this step as a random selection of a difficulty band or as a universal total-order energy budget.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:284"}, {"title": "Filter input ranges", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Field", "Observed non-nil values", "Matching rule"], "rows": [["1", "PlayerMin", "8,16,30,36,51,61,81", "Player level ≥ value"], ["2", "PlayerMax", "7,15,29,35,50,60,80", "Player level ≤ value"], ["3", "DiffSumMin", "2,001 or 2,501", "Completed difficulty ≥ value"], ["4", "DiffSumMax", "2,000 or 2,500", "Completed difficulty ≤ value"], ["5", "sMonthPay / eMonthPay", "Absent in the default file", "Supported inclusive lower/upper bounds. Units and range unestablished here."]]}, "takeaway": "Nil means no restriction for that bound. The first row satisfying every configured condition wins.", "note": "No numeric clamps or row sorting appear in this consumer. A matching row is expected. Do not assume an automatic nearest-band fallback. The monthly payment value comes from GameModel.GetMonthPay; this scope does not establish a currency unit.", "src": "config/Data/Config/OrderRandomConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:284"}, {"title": "Candidate difficulty ranges", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Position", "Observed Min", "Observed Max", "Code rule"], "rows": [["1", "First", "5–12", "6–12", "Inclusive Min ≤ effective level ≤ Max"], ["2", "Second", "4 only", "5–10", "Same comparisons"], ["3", "Third", "3 only", "3,4,5,6,10", "Same comparisons"]]}, "takeaway": "Effective level = DifficultyLevel when supplied, otherwise chain level. Missing bounds are open. Reversed bounds can empty the pool.", "note": "These are observed field spans, not universal legal ranges. FirstMin exact set5,6,7,8,9,10,11,12. FirstMax6,7,8,9,10,11,12. SecondMax5,6,7,8,9,10. Type16 supplies nil for all six limits. No explicit Min≤Max validator appears in this helper.", "src": "config/Data/Config/OrderRandomConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:864"}, {"title": "A one-point change crosses a filter boundary", "tag": "Worked boundary example", "rows": [], "table": {"headers": ["#", "Assumed player", "Completed DiffScore", "First range", "Second / third max"], "rows": [["1", "Level 40, Random3", "2,000", "8–10", "7 / 5"], ["2", "Level 40, Random3", "2,001", "9–10", "8 / 5"], ["3", "Level 61+, Random3", "2,500", "9–10", "8 / 5"], ["4", "Level 61+, Random3", "2,501", "10 exactly", "8 / 6"]]}, "takeaway": "These are real bundled filter boundaries. Crossing one can change several positions without changing item Price.", "note": "\n#; Assumed player; Completed DiffScore; First range; Second / third max\n1; Level 40, Random3; 2,000; 8–10; 7 / 5\n2; Level 40, Random3; 2,001; 9–10; 8 / 5\n3; Level 61+, Random3; 2,500; 9–10; 8 / 5\n4; Level 61+, Random3; 2,501; 10 exactly; 8 / 6\n\nAssume normal Random3 creation and its default configuration. These rows constrain candidate difficulty, not measured energy expenditure. Values are not claimed as active server tuning.", "src": "config/Data/Config/OrderRandomConfig.lua:94", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"At player level40 for Random3, FirstMin changes from8to9 and SecondMax from7to8 when completed DiffScore crosses2000to2001.\">\u003ctitle>Difficulty band step chart\u003c/title>\u003cdesc>At player level40 for Random3, FirstMin changes from8to9 and SecondMax from7to8 when completed DiffScore crosses2000to2001.\u003c/desc>\u003ctext x=\"55\" y=\"35\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"25\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">FirstMin\u003c/text>\u003cline x1=\"105\" y1=\"300\" x2=\"525\" y2=\"300\" stroke=\"#c8d5ce\" stroke-width=\"2\"/>\u003cline x1=\"105\" y1=\"75\" x2=\"105\" y2=\"300\" stroke=\"#c8d5ce\" stroke-width=\"2\"/>\u003ctext x=\"87\" y=\"242\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"end\">8\u003c/text>\u003cline x1=\"105\" y1=\"235\" x2=\"525\" y2=\"235\" stroke=\"#c8d5ce\" stroke-width=\"1\"/>\u003ctext x=\"87\" y=\"127\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"end\">9\u003c/text>\u003cline x1=\"105\" y1=\"120\" x2=\"525\" y2=\"120\" stroke=\"#c8d5ce\" stroke-width=\"1\"/>\u003cline x1=\"115\" y1=\"235\" x2=\"315\" y2=\"235\" stroke=\"#287d71\" stroke-width=\"5\"/>\u003cline x1=\"315\" y1=\"235\" x2=\"315\" y2=\"120\" stroke=\"#287d71\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/>\u003cline x1=\"315\" y1=\"120\" x2=\"515\" y2=\"120\" stroke=\"#287d71\" stroke-width=\"5\"/>\u003ccircle cx=\"303\" cy=\"235\" r=\"7\" fill=\"#287d71\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ccircle cx=\"315\" cy=\"120\" r=\"7\" fill=\"#287d71\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"265\" y=\"335\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"end\">2,000\u003c/text>\u003ctext x=\"335\" y=\"335\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">2,001\u003c/text>\u003ctext x=\"110\" y=\"382\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Accumulated completed DiffScore\u003c/text>\u003ctext x=\"660\" y=\"35\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"25\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">SecondMax\u003c/text>\u003cline x1=\"710\" y1=\"300\" x2=\"1130\" y2=\"300\" stroke=\"#c8d5ce\" stroke-width=\"2\"/>\u003cline x1=\"710\" y1=\"75\" x2=\"710\" y2=\"300\" stroke=\"#c8d5ce\" stroke-width=\"2\"/>\u003ctext x=\"692\" y=\"242\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"end\">7\u003c/text>\u003cline x1=\"710\" y1=\"235\" x2=\"1130\" y2=\"235\" stroke=\"#c8d5ce\" stroke-width=\"1\"/>\u003ctext x=\"692\" y=\"127\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"end\">8\u003c/text>\u003cline x1=\"710\" y1=\"120\" x2=\"1130\" y2=\"120\" stroke=\"#c8d5ce\" stroke-width=\"1\"/>\u003cline x1=\"720\" y1=\"235\" x2=\"920\" y2=\"235\" stroke=\"#287d71\" stroke-width=\"5\"/>\u003cline x1=\"920\" y1=\"235\" x2=\"920\" y2=\"120\" stroke=\"#287d71\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/>\u003cline x1=\"920\" y1=\"120\" x2=\"1120\" y2=\"120\" stroke=\"#287d71\" stroke-width=\"5\"/>\u003ccircle cx=\"908\" cy=\"235\" r=\"7\" fill=\"#287d71\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ccircle cx=\"920\" cy=\"120\" r=\"7\" fill=\"#287d71\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"870\" y=\"335\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"end\">2,000\u003c/text>\u003ctext x=\"940\" y=\"335\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">2,001\u003c/text>\u003ctext x=\"715\" y=\"382\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Accumulated completed DiffScore\u003c/text>\u003ctext x=\"600\" y=\"62\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#287d71\" font-weight=\"400\" text-anchor=\"middle\">Player level 40 / Random3\u003c/text>\u003c/svg>", "caption": "Bundled boundary: first range 8–10 becomes 9–10; second maximum 7 becomes 8. Third maximum stays 5. The graph focuses on the threshold, not a measured time series."}}, {"title": "Candidate filtering", "tag": "Generation", "rows": [["Pass basic eligibility", "Progression, player level, generator unlock, allowed slot and positive base weight."], ["Exclude exact repeats", "Normal rules exclude item codes already requested by active orders or present in the last completed order in this slot."], ["Apply position limits", "Filter remaining items using the first, second or third candidate’s difficulty range."]], "note": "The exclusions operate on exact item codes. They do not establish a universal prohibition against different levels from the same chain. alreadyRequiredItems influences subsequent picks in the same order.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:438,608,864"}, {"title": "What the order pool contains", "tag": "Order pool", "rows": [["Master item catalog", "The inspected default OrderItemConfig has 74 item records. It supplies item candidates, not a catalog of complete random orders."], ["Runtime source", "The picker reads the loaded item-config map. A replacement config can change that catalog. The 74-record count is not a universal live pool size."], ["Fresh candidate sets", "Each pick evaluates the map again against current conditions. Selecting an item does not permanently delete its record from the master catalog."]], "src": "config/Data/Config/OrderItemConfig.lua; core/Board/Model/Order/MainOrderModel.lua:66,1164; core/Board/Model/Order/MainOrderCreatorRandom.lua:484", "note": "Of the74 bundled records,73 have Weight100 and one has Weight 0. A positive base weight is only one gate, not proof that73 items are eligible. The master order-item catalog is a subset of the wider game-item system. Fixed/tutorial creators may use scripted requirements, unlike this normal random pipeline."}, {"title": "The pools used during selection", "tag": "Order pool", "rows": [], "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:306,438,484,608,864", "note": "Effective weighting includes context, conditional dynamic promotion and applicable chain repetition penalties. Backup candidates can include fully passing items too: a zero rejection mask passes the backup mask test. The pools are conceptual stages of runtime collections, not separate persistent inventories.", "table": {"headers": ["#", "Pool", "What it contains", "When it matters"], "rows": [["1", "Master catalog", "All loaded order-item records", "The source for candidate construction"], ["2", "Normal candidate pool", "Items passing unlock, slot, generator, weight and duplicate checks", "Before this position’s difficulty filter"], ["3", "Final selection pool", "Candidates inside the position’s range, with effective weights", "The weighted item draw"], ["4", "Backup pool", "Candidates with no disallowed blocker beyond repeat conflicts", "Restricted fallback for the first candidate"]]}, "takeaway": "The first, second and third positions can have different pools. There is no single fixed eligible list for the whole order."}, {"title": "A seven-item pool example", "tag": "Worked pool example", "rows": [["Teaching subset", "Consider only codes 203, 204, 205, 206, 207, 306 and 902. The following probabilities are conditional on this restricted subset."], ["Assumed player state", "Player level 10, normal slot 1, Random1 default. Active orders request 205. The slot’s last completed order contained 206. Relevant generators are unlocked."], ["Ranges and modifiers", "FirstMax 6, SecondMax 5. No tracked WeightMultiple items are owned or requested. No repeat penalty or dynamic promotion applies."]], "src": "config/Data/Config/OrderItemConfig.lua; config/Data/Config/OrderRandomConfig.lua:1; core/Board/Model/Order/MainOrderCreatorRandom.lua:484", "note": "This is not a captured account snapshot or a proof that all other67 master items fail. Other items can qualify in the full runtime pool. Codes203,204,207 are chain2 levels3,4,7 with no DifficultyLevel override. The assumed active205 and selected203 are not WeightMultiple-marked items, so they do not change this example’s tracked-chain multiplier. Spaces in identifiers below are presentation text only."}, {"title": "Why items leave the example pool", "tag": "Order pool", "rows": [], "src": "config/Data/Config/OrderItemConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:608,864", "note": "Shown reasons are sufficient to exclude each listed item, not necessarily the only failures that could apply to an actual account. If multiple conditions fail, the code records multiple rejection bits. The diagram example uses assumed state and actual bundled item fields.", "table": {"headers": ["#", "Item", "Exclusion reason", "Stage"], "rows": [["1", "205", "Already requested by an active order", "Duplicate check"], ["2", "206", "Appeared in this slot’s last completed order", "Slot-history check"], ["3", "207", "Effective level 7 exceeds FirstMax 6", "Position difficulty filter"], ["4", "306", "Player 10 is below UnlockLevel 15", "Player-level gate"], ["5", "902", "Base Weight 0", "Positive-weight gate"]]}, "takeaway": "From the seven displayed records, only 203 and 204 reach the first weighted draw. Excluded items remain in the master catalog."}, {"title": "First pick: final weights in this subset", "tag": "Order pool", "rows": [], "src": "config/Data/Config/OrderItemConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:484,658", "note": "Chain2 has higher items marked WeightMultiple=1. With no tracked items owned or requested, its NotRequiredBase chain multiplier1000 applies to these lower items as well. Item-specific multipliers take precedence when present, but none applies here. This example deliberately isolates that branch.", "table": {"headers": ["#", "Candidate", "Base × context", "Final weight", "Conditional chance"], "rows": [["1", "203 / level 3", "100 × 1,000", "100,000", "50%"], ["2", "204 / level 4", "100 × 1,000", "100,000", "50%"]]}, "takeaway": "Total displayed weight = 200,000. Each chance is 100,000 ÷ 200,000. Additional eligible items in the real pool would change the denominator."}, {"title": "Second pick: the pool is rebuilt", "tag": "Worked pool example", "rows": [["Assume the first draw selects 203", "The picker appends 203 to alreadyRequiredItems. No board item is consumed during generation."], ["Rebuild and refilter", "203 now fails the exact-code duplicate check. 204 remains eligible. 207 still exceeds SecondMax 5. The other displayed exclusions remain."], ["Result within the subset", "Only 204 remains, with weight 100,000 and conditional chance 100%. A different level from the same chain can remain eligible."]], "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:330; core/Board/Model/Board/MainBoardModel.lua:973", "note": "Assume the first draw selects 203: The picker appends 203 to alreadyRequiredItems. No board item is consumed during generation.\nRebuild and refilter: 203 now fails the exact-code duplicate check. 204 remains eligible. 207 still exceeds SecondMax 5. The other displayed exclusions remain.\nResult within the subset: Only 204 remains, with weight 100,000 and conditional chance 100%. A different level from the same chain can remain eligible.\n\nThe candidate map is rebuilt from the master records and current requirements, not merely copied and depleted. Newly selected items can also change shortage/context weighting in other scenarios. Here203 is not marked WeightMultiple, so the chain-context branch remains unchanged. The final request-count draw happens later and can keep only the first candidate.", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 400\" role=\"img\" aria-label=\"Restricted teaching subset: first pool has203 and204 at50percent each. After choosing203, the second pool excludes203 and retains204 at100percent.\">\u003ctitle>Pool rebuilding after the first pick\u003c/title>\n\u003cg font-family=\"Arial,Helvetica,sans-serif\" fill=\"#102f35\">\n\u003ctext x=\"25\" y=\"35\" font-size=\"26\" font-weight=\"700\">Restricted teaching subset\u003c/text>\n\u003ctext x=\"25\" y=\"100\" font-size=\"24\" font-weight=\"700\">First draw\u003c/text>\n\u003crect x=\"270\" y=\"60\" width=\"420\" height=\"70\" fill=\"#287d71\"/>\u003crect x=\"690\" y=\"60\" width=\"420\" height=\"70\" fill=\"#c38a23\"/>\n\u003ctext x=\"480\" y=\"104\" text-anchor=\"middle\" font-size=\"26\" fill=\"white\">203: 50%\u003c/text>\u003ctext x=\"900\" y=\"104\" text-anchor=\"middle\" font-size=\"26\" fill=\"white\">204: 50%\u003c/text>\n\u003ctext x=\"270\" y=\"172\" font-size=\"22\">Choose 203. Add it to this order’s requirements in progress.\u003c/text>\n\u003cpath d=\"M690 187 L690 224 L680 214 M690 224 L700 214\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\n\u003ctext x=\"25\" y=\"282\" font-size=\"24\" font-weight=\"700\">Second draw\u003c/text>\n\u003crect x=\"270\" y=\"240\" width=\"840\" height=\"70\" fill=\"#c38a23\"/>\u003ctext x=\"690\" y=\"284\" text-anchor=\"middle\" font-size=\"26\" fill=\"white\">204: 100%\u003c/text>\n\u003ctext x=\"270\" y=\"355\" font-size=\"22\">203 excluded. 204 remains at weight 100,000. SecondMax = 5.\u003c/text>\n\u003c/g>\u003c/svg>", "caption": "The pool is rebuilt, including new exact-code demand. These percentages apply only to the displayed subset. The separate request-count draw can still retain just the first item."}}, {"title": "When the backup pool can be used", "tag": "Order pool", "rows": [["Enable condition", "The slot earns a positive Order Boost smile score, or it is the continuous-order slot. Ordinary random slots do not always have backup candidates."], ["Relaxed checks", "Backup allows current-order and last-slot-order repeat conflicts. It can also contain items with no rejection flags."], ["Checks still enforced", "Progression, player level, generator availability, ForbiddenSlot and positive weight. Candidate difficulty limits still apply."], ["Use condition", "The normal pool is empty after position filtering. In this normal-random helper, backup use is enabled for the first candidate only."]], "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:330,438,474,553", "note": "CheckItemTypeState masks out only OnlyItemHasLastOrder and OnlyItemHasOtherOrder; every other rejection bit makes the item ineligible for backup. A pass mask0 also satisfies the mask check. If backup still yields no first candidate, Create returns no order. The baseline creator uses a different surplus pool and is not this backup mechanism."}, {"title": "Backup example: repeat conflict versus a hard gate", "tag": "Order pool", "rows": [], "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:474,553,608", "note": "This is a separate conditional fallback illustration, not a claim that the normal pool in the preceding seven-item example was empty. The separate baseline pool reads owned counts minus active demand and RecommendedNumber. It does not automatically replace any failed normal pick.", "table": {"headers": ["#", "Candidate condition", "May enter backup?", "Reason"], "rows": [["1", "205 requested elsewhere; all other checks pass", "Yes", "Only a current-order repeat conflict"], ["2", "206 in last slot order; all other checks pass", "Yes", "Only a last-order repeat conflict"], ["3", "306 at player level 10", "No", "UnlockLevel 15 is still required"], ["4", "902 with Weight 0", "No", "Positive weight remains required"]]}, "takeaway": "Assume backup is enabled and the normal first-position pool is empty. Backup membership still does not guarantee selection."}, {"title": "Inventory changes relative weights", "tag": "Generation", "rows": [["Chain already requested and covered", "The relevant context multiplier is 100 when the tracked chain requirements have no shortage."], ["Chain not requested", "The base context multiplier is 1,000 for a tracked chain with no current requirement."], ["Owned-item context", "Eligible item-specific context can use 10,000. The dynamic flag can increase this further based on occupied lower levels."]], "note": "These rules are constructed from items marked WeightMultiple = 1. The 10,000 condition uses the lowest owned level among the tracked items and applies to candidate levels at or above that level. If a tracked chain is required but lacks items, no boosted chain multiplier is assigned, leaving the default multiplier 1 unless another rule supplies one. These are weight multipliers, never direct probabilities.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:443,484"}, {"title": "Inventory weighting: a concrete comparison", "tag": "Worked example", "rows": [["Assumed pool", "Two eligible candidates have base Weight = 100. Neither chain is currently requested. Each belongs to a tracked chain."], ["Different context", "A gets the chain multiplier 1,000: weight 100,000. B qualifies for the item-specific multiplier 10,000: weight 1,000,000."], ["Result", "With only these two candidates and no other modifiers, A has 9.09% and B has 90.91% of the weight. The specific multiplier takes precedence."]], "note": "Illustrative two-candidate pool using real constants. The item-specific condition compares candidate level with the lowest owned level among tracked items, not a blanket test that the player owns a higher item. Exact fractions: A1/11, B10/11.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:484"}, {"title": "Weight is relative to the remaining pool", "tag": "Teaching example", "rows": [["Assume two eligible candidates", "Candidate A has effective weight 100. Candidate B has effective weight 300."], ["Calculate the chance", "A: 100 ÷ 400 = 25%. B: 300 ÷ 400 = 75%."], ["Change the context", "If a penalty divides B’s weight by 10, A becomes 100 ÷ 130 ≈ 76.9%."]], "note": "Illustrative values only. The example demonstrates weighted selection, not a sampled or observed order. Effective weight can include context multiplication, dynamic promotion and a repeat divisor. Every candidate remaining in the actual pool changes the denominator.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:42,351"}, {"title": "Dynamic levels can promote a harder item", "tag": "Generation", "rows": [["Condition", "A filter supplies a DynamicMax above its normal Max, and owned items satisfy the dynamic checks."], ["Promotion", "The helper considers an eligible higher chain item and multiplies its weight by 50. At chain maximum it can retain the same item."], ["Constraint", "The item must still be in the eligible pool. Existing same-chain demand can prevent promotion."]], "note": "GetDynamicMaxLevel looks at owned configured items with level >= maxLevel and \u003c dynamicMaxLevel. It selects the highest qualifying level. Same-chain required items at equal/higher chain levels need counts strictly above their required counts. Resulting range relaxation applies to the qualifying chains, not every chain. DifficultyLevel can override chain level for filtering. None of the three dynamic-ceiling fields occurs in the default OrderRandomConfig table. This slide explains supported conditional behavior, not always-active default tuning.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:699,864"}, {"title": "Two separate dynamic mechanisms", "tag": "Generation", "rows": [["Inventory weighting flag", "order_diff_dynamic can multiply context weight by 10 for each qualifying occupied lower level."], ["Dynamic-level limits", "DynamicFirstMax, DynamicSecondMax and DynamicThirdMax can permit higher candidates through GetDynamicMaxLevel."], ["Interpretation", "An absent order_diff_dynamic flag does not, by itself, disable all dynamic-level behavior."]], "note": "The weighting path runs inside GetAvailableItems. The promotion path runs in GetDynamicMaxLevel and requires configured dynamic limits plus inventory and demand checks. They should be logged and tested separately.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:533,699"}, {"title": "Dynamic ceilings: strict and inclusive edges", "tag": "Worked example", "rows": [["Illustrative values", "Normal Max = 8. DynamicMax = 10. These values are chosen for explanation, not found in the default random table."], ["Owned-item check", "Owned level 8 or 9 can enter promotion checks because 8 ≤ level \u003c 10. Owned level 10 fails this strict upper test."], ["Candidate effect", "A qualifying next item can receive ×50 weight and a chain-specific higher ceiling. Demand checks and candidate eligibility still apply."]], "note": "Illustrative values: Normal Max = 8. DynamicMax = 10. These values are chosen for explanation, not found in the default random table.\nOwned-item check: Owned level 8 or 9 can enter promotion checks because 8 ≤ level \u003c 10. Owned level 10 fails this strict upper test.\nCandidate effect: A qualifying next item can receive ×50 weight and a chain-specific higher ceiling. Demand checks and candidate eligibility still apply.\n\nDynamicFirstMax, DynamicSecondMax and DynamicThirdMax are absent from the unsuffixed default file. No observed numeric range is established. The helper requires Max\u003cDynamicMax. Normal Max absent, DynamicMax absent or DynamicMax≤Max prevents this branch. DifficultyLevel overrides chain level for the range input, while next-item lookup uses the chain graph.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:699", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"Illustrative normalMax8DynamicMax10. Owned levels8and9enter promotion checks;level10does not. Other eligibility and demand checks still apply.\">\u003ctitle>Dynamic owned-item interval\u003c/title>\u003cdesc>Illustrative normalMax8DynamicMax10. Owned levels8and9enter promotion checks;level10does not. Other eligibility and demand checks still apply.\u003c/desc>\u003ctext x=\"30\" y=\"38\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"30\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">Owned-item qualification: 8 ≤ level &lt; 10\u003c/text>\u003cline x1=\"120\" y1=\"170\" x2=\"1080\" y2=\"170\" stroke=\"#c8d5ce\" stroke-width=\"5\"/>\u003cline x1=\"360\" y1=\"170\" x2=\"840\" y2=\"170\" stroke=\"#287d71\" stroke-width=\"13\"/>\u003ccircle cx=\"120\" cy=\"170\" r=\"11\" fill=\"#7d8e89\" stroke=\"#7d8e89\" stroke-width=\"3\"/>\u003ctext x=\"120\" y=\"225\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"28\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">7\u003c/text>\u003ccircle cx=\"360\" cy=\"170\" r=\"11\" fill=\"#287d71\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"360\" y=\"225\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"28\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">8\u003c/text>\u003ccircle cx=\"600\" cy=\"170\" r=\"11\" fill=\"#287d71\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"600\" y=\"225\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"28\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">9\u003c/text>\u003ccircle cx=\"840\" cy=\"170\" r=\"11\" fill=\"#f7f5ef\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"840\" y=\"225\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"28\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">10\u003c/text>\u003ccircle cx=\"1080\" cy=\"170\" r=\"11\" fill=\"#7d8e89\" stroke=\"#7d8e89\" stroke-width=\"3\"/>\u003ctext x=\"1080\" y=\"225\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"28\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"middle\">11\u003c/text>\u003ctext x=\"360\" y=\"115\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"23\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"middle\">Normal Max = 8\u003c/text>\u003ctext x=\"840\" y=\"115\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"23\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"middle\">DynamicMax = 10\u003c/text>\u003ctext x=\"480\" y=\"285\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"26\" fill=\"#287d71\" font-weight=\"700\" text-anchor=\"middle\">Owned levels 8 and 9 qualify\u003c/text>\u003ctext x=\"840\" y=\"322\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#ad5348\" font-weight=\"700\" text-anchor=\"middle\">10 is excluded here\u003c/text>\u003ctext x=\"30\" y=\"385\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">If all other checks pass, the eligible next candidate can receive ×50 weight.\u003c/text>\u003c/svg>", "caption": "Illustrative limits, not observed defaults. The open circle describes the owned-item test; a promoted candidate may reach the dynamic ceiling. Promotion is chain-specific and still depends on demand and eligibility."}}, {"title": "Repeat history discourages the same chain", "tag": "Generation", "rows": [["Completion", "A qualifying completed item resets its chain’s repeat counter to 3."], ["Future selection", "While that counter exists, supported creators divide candidate weight by RepeatWeightDecrease."], ["Counter updates", "A considered penalized chain can count down when unselected. Selection can reset its counter."]], "note": "This is not simply a three-order ban. Candidate selection and bookkeeping occur before final request-count selection, so history can reflect candidate work even when fewer requirements appear. Supported types include Random1, Random2, Random3, Random4, Random5New and continuous orders.", "src": "core/Board/Model/Order/MainOrderModel.lua:569,582,594,600; core/Board/Model/Order/MainOrderCreatorRandom.lua:25"}, {"title": "Repeat divisors change weight, not eligibility", "tag": "Worked weight example", "rows": [], "table": {"headers": ["#", "RepeatWeightDecrease", "Weight before", "Weight after", "Share against rival weight 1,000"], "rows": [["1", "10", "10,000", "1,000", "50%"], ["2", "50", "10,000", "200", "16.67%"], ["3", "100", "10,000", "100", "9.09%"]]}, "takeaway": "Assume one penalized candidate and one rival. The counter starts at 3, but it counts qualifying selection opportunities rather than three delivered orders.", "note": "\n#; RepeatWeightDecrease; Weight before; Weight after; Share against rival weight 1,000\n1; 10; 10,000; 1,000; 50%\n2; 50; 10,000; 200; 16.67%\n3; 100; 10,000; 100; 9.09%\n\nThe unpenalized candidate would have10,000/11,000=90.91% against that rival. A considered penalized chain can decrement when not selected, while selection resets it. Candidate bookkeeping precedes final count selection. Avoid interpreting this example as a hard ban. Zero is unsafe as a divisor.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:25,42; core/Board/Model/Order/MainOrderModel.lua:582,594", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"Against a rival with weight1000, candidate weight10000 gives90.91percent. Divisors10,50,100 lower its chance to50,16.67,9.09percent.\">\u003ctitle>Repeat penalty probabilities\u003c/title>\u003cdesc>Against a rival with weight1000, candidate weight10000 gives90.91percent. Divisors10,50,100 lower its chance to50,16.67,9.09percent.\u003c/desc>\u003ctext x=\"30\" y=\"62\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"23\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">No penalty\u003c/text>\u003crect x=\"260\" y=\"35\" width=\"720\" height=\"40\" rx=\"0\" fill=\"#e1e7df\"/>\u003crect x=\"260\" y=\"35\" width=\"654.5454545454545\" height=\"40\" rx=\"0\" fill=\"#c38a23\"/>\u003ctext x=\"1000\" y=\"62\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">90.91%\u003c/text>\u003ctext x=\"260\" y=\"97\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#58706c\" font-weight=\"400\" text-anchor=\"start\">Effective weight 10,000\u003c/text>\u003ctext x=\"30\" y=\"140\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"23\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Divide by 10\u003c/text>\u003crect x=\"260\" y=\"113\" width=\"720\" height=\"40\" rx=\"0\" fill=\"#e1e7df\"/>\u003crect x=\"260\" y=\"113\" width=\"360.0\" height=\"40\" rx=\"0\" fill=\"#287d71\"/>\u003ctext x=\"1000\" y=\"140\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">50.00%\u003c/text>\u003ctext x=\"260\" y=\"175\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#58706c\" font-weight=\"400\" text-anchor=\"start\">Effective weight 1,000\u003c/text>\u003ctext x=\"30\" y=\"218\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"23\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Divide by 50\u003c/text>\u003crect x=\"260\" y=\"191\" width=\"720\" height=\"40\" rx=\"0\" fill=\"#e1e7df\"/>\u003crect x=\"260\" y=\"191\" width=\"119.99999999999999\" height=\"40\" rx=\"0\" fill=\"#287d71\"/>\u003ctext x=\"1000\" y=\"218\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">16.67%\u003c/text>\u003ctext x=\"260\" y=\"253\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#58706c\" font-weight=\"400\" text-anchor=\"start\">Effective weight 200\u003c/text>\u003ctext x=\"30\" y=\"296\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"23\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Divide by 100\u003c/text>\u003crect x=\"260\" y=\"269\" width=\"720\" height=\"40\" rx=\"0\" fill=\"#e1e7df\"/>\u003crect x=\"260\" y=\"269\" width=\"65.45454545454545\" height=\"40\" rx=\"0\" fill=\"#287d71\"/>\u003ctext x=\"1000\" y=\"296\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">9.09%\u003c/text>\u003ctext x=\"260\" y=\"331\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#58706c\" font-weight=\"400\" text-anchor=\"start\">Effective weight 100\u003c/text>\u003ctext x=\"30\" y=\"392\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Assumptions: pre-penalty weight 10,000; one rival with weight 1,000; no other candidates.\u003c/text>\u003c/svg>", "caption": "The rival stays fixed. A divisor changes selection chance rather than banning the item. The chain counter starts at 3 and follows selection opportunities, not simply three completed orders."}}, {"title": "Candidate selection runs in sequence", "tag": "Generation", "rows": [["First candidate", "Build its pool, apply its range, adjust weights and draw one item."], ["Second candidate", "Rebuild using the first selected item as an additional requirement."], ["Third candidate", "Repeat with both previous selections. A missing earlier candidate stops later picks."]], "note": "The code calls selectItem for First, then Second only if First exists, then Third only if Second exists. Rebuilding matters because requirements, shortages and exclusions can change between picks.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:306"}, {"title": "The request count is a separate draw", "tag": "Generation", "rows": [["Count configuration", "Use ItemAmounts in the selected random config when valid. Otherwise use the player-level item-count table."], ["Available choices", "One item needs the first candidate. Two need the first two. Three need all three."], ["Final request", "A weighted draw chooses the count, then keeps that prefix of the selected candidates."]], "note": "Count weights are OneItemWeight, TwoItemsWeight and ThreeItemsWeight. The fallback table scans from its final entry down to the first matching level. A candidate can exist even when its count weight is zero.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:121; config/Data/Config/OrderItemNumberWeightConfig.lua"}, {"title": "Fallback item-count weights", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Player level", "One item", "Two items", "Three items"], "rows": [["1", "1–3", "60", "20", "20"], ["2", "4–7", "40", "30", "30"], ["3", "8–10", "33", "33", "34"], ["4", "11+", "30", "30", "40"]]}, "takeaway": "This table applies only when no usable ItemAmounts override exists. With all three candidates available, these totals of 100 also read as percentages.", "note": "The source threshold levels are1,4,8,11. The runtime scans the table backward for the first threshold≤playerLevel. Weights need not sum to100 in general.", "src": "config/Data/Config/OrderItemNumberWeightConfig.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua:137"}, {"title": "Candidate availability changes count probability", "tag": "Worked count example", "rows": [], "table": {"headers": ["#", "Level 11 fallback", "Retained weights", "One item", "Two / three items"], "rows": [["1", "Three candidates", "30, 30, 40", "30%", "30% / 40%"], ["2", "Two candidates", "30, 30", "50%", "50% / unavailable"], ["3", "One candidate", "30", "100%", "Unavailable / unavailable"]]}, "takeaway": "Unavailable counts leave the lottery entirely. The picker renormalizes across the choices that remain.", "note": "\n#; Level 11 fallback; Retained weights; One item; Two / three items\n1; Three candidates; 30, 30, 40; 30%; 30% / 40%\n2; Two candidates; 30, 30; 50%; 50% / unavailable\n3; One candidate; 30; 100%; Unavailable / unavailable\n\nExample assumes no usable ItemAmounts override. An unavailable third candidate does not create a40% failed-order branch. With no first candidate, no request is created.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:164; base/Common/Utility/Table.lua:91", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"At level11 with no override,3candidates yield30/30/40percent,2candidates50/50percent,and1candidate100percent for one item.\">\u003ctitle>Request count probability\u003c/title>\u003cdesc>At level11 with no override,3candidates yield30/30/40percent,2candidates50/50percent,and1candidate100percent for one item.\u003c/desc>\u003crect x=\"30\" y=\"15\" width=\"18\" height=\"18\" rx=\"0\" fill=\"#287d71\"/>\u003ctext x=\"60\" y=\"32\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">1 requested item\u003c/text>\u003crect x=\"420\" y=\"15\" width=\"18\" height=\"18\" rx=\"0\" fill=\"#c38a23\"/>\u003ctext x=\"450\" y=\"32\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">2 requested items\u003c/text>\u003crect x=\"810\" y=\"15\" width=\"18\" height=\"18\" rx=\"0\" fill=\"#6588ad\"/>\u003ctext x=\"840\" y=\"32\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">3 requested items\u003c/text>\u003ctext x=\"30\" y=\"130\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">3 candidates\u003c/text>\u003crect x=\"260\" y=\"95\" width=\"258.0\" height=\"55\" rx=\"0\" fill=\"#287d71\"/>\u003ctext x=\"389.0\" y=\"131\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">30%\u003c/text>\u003crect x=\"518.0\" y=\"95\" width=\"258.0\" height=\"55\" rx=\"0\" fill=\"#c38a23\"/>\u003ctext x=\"647.0\" y=\"131\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">30%\u003c/text>\u003crect x=\"776.0\" y=\"95\" width=\"344.0\" height=\"55\" rx=\"0\" fill=\"#6588ad\"/>\u003ctext x=\"948.0\" y=\"131\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">40%\u003c/text>\u003ctext x=\"30\" y=\"223\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">2 candidates\u003c/text>\u003crect x=\"260\" y=\"188\" width=\"430.0\" height=\"55\" rx=\"0\" fill=\"#287d71\"/>\u003ctext x=\"475.0\" y=\"224\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">50%\u003c/text>\u003crect x=\"690.0\" y=\"188\" width=\"430.0\" height=\"55\" rx=\"0\" fill=\"#c38a23\"/>\u003ctext x=\"905.0\" y=\"224\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">50%\u003c/text>\u003ctext x=\"30\" y=\"316\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">1 candidate\u003c/text>\u003crect x=\"260\" y=\"281\" width=\"860.0\" height=\"55\" rx=\"0\" fill=\"#287d71\"/>\u003ctext x=\"690.0\" y=\"317\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#ffffff\" font-weight=\"700\" text-anchor=\"middle\">100%\u003c/text>\u003ctext x=\"30\" y=\"395\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Player level 11. Fallback weights 30 / 30 / 40. No ItemAmounts override.\u003c/text>\u003c/svg>", "caption": "Missing candidates remove count options before the draw. Two candidates produce 50% / 50%, rather than a failed 40% branch."}}, {"title": "Count-weight constraints and bad inputs", "tag": "Parameter reference", "rows": [["Observed values", "Overrides use 50/50/0 or 100/0/0. Fallback rows use 20, 30, 33, 34, 40 and 60. These are weights, not enforced percentage limits."], ["Missing fields", "A missing recognized key becomes 0. If no recognized key exists, the override is abandoned in favor of the fallback table."], ["Safe authoring contract", "Use nonnegative weights and a positive integer total among available choices. An all-zero total triggers an assertion and is not a supported way to disable creation."]], "note": "The safe authoring contract is a recommendation. Individual nonnegative field validation is absent. The selector asserts for total≤0 and the random helper asserts if its total bound is nonintegral. The source has fallback/error behavior, so do not characterize assertions as a guaranteed hard reject in every release build.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:137; base/Common/Utility/Table.lua:91; base/Common/Utility/MathUtil.lua:23"}, {"title": "A bundled Random1 example", "tag": "Bundled default example", "rows": [["Assumptions", "Player level 10. Random1 wins creator selection. Creation allowance and candidate pools are available."], ["Candidate ceilings", "FirstMax = 6, SecondMax = 5, ThirdMax = 3."], ["Count choice", "One-item weight 50, two-item weight 50, three-item weight 0. With two candidates, the split is 50% / 50%."]], "note": "This is a worked branch through bundled OrderRandomConfig, not live tuning. Type 1 unlocks at level 3, has Point 5 and RefreshTime 3600 seconds. If only the first candidate is available, one item is the only valid count. No concrete item or random seed is invented.", "src": "config/Data/Config/OrderRandomConfig.lua:1; core/Board/Model/Order/MainOrderCreatorRandom.lua:121,899"}, {"title": "Empty pools and fallback behavior", "tag": "Generation", "rows": [["No first candidate", "The random creator returns no order. Periodic fill attempts can try again later."], ["Restricted relaxation", "Order Boost and continuous-order contexts can provide backup candidates excluded only by repeat checks."], ["Dispatcher detail", "The random dispatcher uses the first eligible creator. If its Create returns nil, it does not try every later random creator in that call."]], "note": "The normal selectItem call enables backup use only for the first candidate. Special fallback eligibility does not bypass unrelated unlock or forbidden-slot failures. Baseline is a separate creator, not a universal final retry for every empty pool.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:330,484,1067"}, {"title": "Customer assignment and saving", "tag": "Completion", "rows": [["Assignment", "The creator obtains an avatar. Chest Customer can replace the normal customer assignment."], ["Saved request", "Slot, type, item codes, avatar and ID persist, with supporting metadata and gifts."], ["Reload behavior", "The model reconstructs saved orders and restores relevant history. Opening the game does not automatically reroll all orders."]], "note": "The slot model saves each new order, adds it to the active set and updates board readiness. MainOrderModel restores the last finished order per slot and repeat-weight state as well as active requests.", "src": "core/Board/Model/Order/MainOrderCreatorRandom.lua:224; core/Board/Model/Order/MainOrderModel.lua:271,307,324,340"}, {"title": "Delivery uses exact item codes", "tag": "Completion", "rows": [["Availability check", "The order cell revalidates delivery before invoking completion."], ["Consumption", "For each requirement, the client searches the board first, then storage, for an exact code match."], ["Transaction sequence", "The normal path grants primary rewards before removing items, then handles further rewards, history and refill."]], "note": "Lower-level items are not automatically converted into equivalent requirements. Special and branch orders route through separate completion logic. The observed source ordering is not proof of a server-side atomic transaction or recovery guarantee.", "src": "core/Board/View/Order/BaseOrderCell.lua:22; core/Board/Model/Board/MainBoardModel.lua:1078,1140"}, {"title": "Rewards have several layers", "tag": "Completion", "rows": [["Base currency", "Sum item Price, then apply the gold-buff multiplier and round upward. The multiplier is 1 or 2 in this path."], ["Alternate rules", "Baseline can use RecommendedPrice. Bake Out can switch the currency property. Intimacy orders can suppress gold."], ["Additional rewards", "Activities, gifts and buffs can use price, difficulty or the order object to add rewards."]], "note": "MainOrder.GetRewards composes activity rewards. MainBoardModel also handles gift and buff rewards. Item Price alone therefore cannot reproduce every reward shown on an order.", "src": "core/Board/Model/Order/MainOrder.lua:95,98,144,243,325; core/Board/Model/Board/MainBoardModel.lua:1085"}, {"title": "A reward and difficulty calculation", "tag": "Teaching example using bundled values", "rows": [["Assumed delivered request", "Item codes 203 and 204. Prices: 2 and 4. DiffScores: 2 and 5."], ["Base reward", "Price total = 6. Standard currency amount = 6, or 12 with the 2× gold buff."], ["Difficulty feedback", "DiffScore total = 7. Completion adds 7 to the accumulated difficulty when the order occupies a normal slot."]], "note": "The two-item request is an illustrative input, not proof that this exact pair is selected in a specific player state. Values come from the first rows of the bundled item table. Additional event rewards are excluded from this arithmetic example.", "src": "config/Data/Config/OrderItemConfig.lua:1; core/Board/Model/Order/MainOrder.lua:243,341; core/Board/Model/Order/MainOrderModel.lua:560"}, {"title": "Completion feeds future orders", "tag": "Completion", "rows": [["Accumulated difficulty", "Normal slots 1, 2, 3, 4, 5 and 8 add their completed DiffScore to the saved total."], ["Daily reset", "The client resets that total at the next local 2 AM boundary. Active requests do not automatically regenerate because of this reset."], ["Other feedback", "The outgoing order becomes slot history. Repeat penalties and lucky-trigger eligibility can change before refill."]], "note": "Accumulated difficulty: Normal slots 1, 2, 3, 4, 5 and 8 add their completed DiffScore to the saved total.\nDaily reset: The client resets that total at the next local 2 AM boundary. Active requests do not automatically regenerate because of this reset.\nOther feedback: The outgoing order becomes slot history. Repeat penalties and lucky-trigger eligibility can change before refill.\n\nTryRefreshTotalDiffScore runs in the per-second update. The next refresh uses TimeUtil.ToNext2AMClockTimestamp(localeTime). The total represents completed difficulty in this cycle, not lifetime player difficulty or the sum of active requests.", "src": "core/Board/Model/Order/MainOrderModel.lua:254,375,535,560; core/Board/Model/Order/MainOrderDefinition.lua:76", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"Validate exact items,grant primary rewards,remove exact items board first then storage,handle remaining rewards,update difficulty and repeat history,then refill the next order.\">\u003ctitle>Order completion feedback\u003c/title>\u003cdesc>Validate exact items,grant primary rewards,remove exact items board first then storage,handle remaining rewards,update difficulty and repeat history,then refill the next order.\u003c/desc>\u003crect x=\"30\" y=\"40\" width=\"340\" height=\"105\" rx=\"6\" fill=\"#e0ebe3\"/>\u003ctext x=\"48\" y=\"76\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">1  Validate delivery\u003c/text>\u003ctext x=\"48\" y=\"116\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Exact required item codes\u003c/text>\u003crect x=\"430\" y=\"40\" width=\"340\" height=\"105\" rx=\"6\" fill=\"#e0ebe3\"/>\u003ctext x=\"448\" y=\"76\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">2  Grant primary rewards\u003c/text>\u003ctext x=\"448\" y=\"116\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Price-based currency + rewards\u003c/text>\u003crect x=\"830\" y=\"40\" width=\"340\" height=\"105\" rx=\"6\" fill=\"#e0ebe3\"/>\u003ctext x=\"848\" y=\"76\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">3  Remove exact items\u003c/text>\u003ctext x=\"848\" y=\"116\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Board first, then storage\u003c/text>\u003crect x=\"830\" y=\"235\" width=\"340\" height=\"105\" rx=\"6\" fill=\"#e0ebe3\"/>\u003ctext x=\"848\" y=\"271\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">4  Finish reward handling\u003c/text>\u003ctext x=\"848\" y=\"311\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Remaining activity rewards\u003c/text>\u003crect x=\"430\" y=\"235\" width=\"340\" height=\"105\" rx=\"6\" fill=\"#e0ebe3\"/>\u003ctext x=\"448\" y=\"271\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">5  Update history\u003c/text>\u003ctext x=\"448\" y=\"311\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">DiffScore + repeat state\u003c/text>\u003crect x=\"30\" y=\"235\" width=\"340\" height=\"105\" rx=\"6\" fill=\"#e0ebe3\"/>\u003ctext x=\"48\" y=\"271\" font-family=\"Arial,Helvetica,sans-se
