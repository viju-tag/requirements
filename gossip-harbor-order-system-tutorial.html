rif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">6  Attempt refill\u003c/text>\u003ctext x=\"48\" y=\"311\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Next eligible order\u003c/text>\u003cline x1=\"375\" y1=\"92\" x2=\"425\" y2=\"92\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 416 86 L 425 92 L 416 98\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cline x1=\"775\" y1=\"92\" x2=\"825\" y2=\"92\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 816 86 L 825 92 L 816 98\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cline x1=\"1000\" y1=\"150\" x2=\"1000\" y2=\"225\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 994 216 L 1000 225 L 1006 216\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cline x1=\"825\" y1=\"287\" x2=\"775\" y2=\"287\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 784 281 L 775 287 L 784 293\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cline x1=\"425\" y1=\"287\" x2=\"375\" y2=\"287\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 384 281 L 375 287 L 384 293\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cline x1=\"200\" y1=\"230\" x2=\"200\" y2=\"155\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 194 164 L 200 155 L 206 164\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"30\" y=\"395\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">History influences future selection. Price and DiffScore remain separate inputs.\u003c/text>\u003c/svg>", "caption": "Primary rewards precede item removal. Normal-slot DiffScore updates the saved total, which resets at local 2 AM. The loop resumes when a later order is ready for delivery. Special and branch paths differ."}}, {"title": "Difficulty history at the daily boundary", "tag": "Worked example", "rows": [["Before reset", "Assume level 40, Random3, saved total = 2,001. The bundled row permits first difficulty 9–10 and second difficulty up to 8."], ["At the reset", "The per-second update sees the stored local 2 AM boundary and sets the accumulated total to 0. Existing orders stay as saved."], ["Next generation", "If this player remains level 40 on the same config, the next filter lookup uses the lower band: first 8–10, second up to 7."]], "note": "This scenario isolates the difficulty accumulator. It does not guarantee a newly visible order at the reset time. Slot availability, creator priority, cooldown, inventory and every other generation condition still apply.", "src": "core/Board/Model/Order/MainOrderModel.lua:248; config/Data/Config/OrderRandomConfig.lua:94"}, {"title": "Special creators need their own rules", "tag": "Exceptions", "rows": [["Fixed and tutorial", "Scripted progression and teaching steps can determine requirements directly."], ["Special and branch", "Separate gates, progression and delivery behavior. Normal item cleanup cannot be assumed."], ["Activity and utility creators", "Return-user, continuous, extra, lucky, timed, intimacy, chest and baseline paths add conditions or alternate configurations."]], "note": "This deck establishes where these systems connect and selected shared behavior. It does not claim exhaustive coverage of every event schedule, reward payload or special-order transaction. Inspect the relevant creator and activity model when debugging those paths.", "src": "core/Board/Model/Order/MainOrderCreator.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua; core/Board/Model/Order/MainOrderModel.lua:503; core/Board/Model/Board/MainBoardModel.lua:1078"}, {"title": "Baseline orders consume surplus copies", "tag": "Worked example", "rows": [["Configured item 1107", "RecommendedNumber = 2, RecommendedPrice = 42, Price = 54, DiffScore = 140."], ["Eligibility example", "Three owned copies minus one copy demanded by active orders leaves two surplus copies. That meets the threshold of 2."], ["Created request", "Baseline requests two copies. Its base currency is 2 × 42 = 84. With only two owned and one demanded, surplus 1 fails."]], "note": "Configured item 1107: RecommendedNumber = 2, RecommendedPrice = 42, Price = 54, DiffScore = 140.\nEligibility example: Three owned copies minus one copy demanded by active orders leaves two surplus copies. That meets the threshold of 2.\nCreated request: Baseline requests two copies. Its base currency is 2 × 42 = 84. With only two owned and one demanded, surplus 1 fails.\n\nThis baseline path differs from the ordinary random-item filtering path. Do not assume it reapplies every ordinary unlock/forbidden-slot check. Code 1107 has ForbiddenSlot{10,11,18}, not an empty list. Baseline uses slot 15. Although its computed DiffScore is 280, slot 15 is not in the normal-slot accumulated-difficulty set. The baseline eligibility path also has a hardcoded 60-second timer gate.", "src": "config/Data/Config/OrderItemConfig.lua:489; core/Board/Model/Order/MainOrderCreatorRandom.lua:673,1055; core/Board/Model/Order/MainOrder.lua:98", "visual": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 410\" role=\"img\" aria-label=\"Item1107 has3owned copies and1copy already demanded, leaving2surplus copies. It requests2copies at42each, yielding84base currency.\">\u003ctitle>Baseline surplus and reward\u003c/title>\u003cdesc>Item1107 has3owned copies and1copy already demanded, leaving2surplus copies. It requests2copies at42each, yielding84base currency.\u003c/desc>\u003ctext x=\"30\" y=\"38\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"26\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">Item 1107: RecommendedNumber = 2\u003c/text>\u003ctext x=\"100\" y=\"150\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"70\" fill=\"#287d71\" font-weight=\"700\" text-anchor=\"start\">3\u003c/text>\u003ctext x=\"100\" y=\"195\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">owned copies\u003c/text>\u003ctext x=\"470\" y=\"150\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"70\" fill=\"#c38a23\" font-weight=\"700\" text-anchor=\"start\">1\u003c/text>\u003ctext x=\"470\" y=\"195\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">already demanded\u003c/text>\u003ctext x=\"940\" y=\"150\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"70\" fill=\"#287d71\" font-weight=\"700\" text-anchor=\"start\">2\u003c/text>\u003ctext x=\"940\" y=\"195\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">surplus copies\u003c/text>\u003ctext x=\"320\" y=\"143\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"60\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">−\u003c/text>\u003ctext x=\"755\" y=\"143\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"60\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">=\u003c/text>\u003cline x1=\"30\" y1=\"235\" x2=\"1170\" y2=\"235\" stroke=\"#c8d5ce\" stroke-width=\"2\"/>\u003ctext x=\"30\" y=\"288\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"27\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">Surplus 2 ≥ threshold 2\u003c/text>\u003cline x1=\"420\" y1=\"278\" x2=\"570\" y2=\"278\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003cpath d=\"M 561 272 L 570 278 L 561 284\" fill=\"none\" stroke=\"#287d71\" stroke-width=\"3\"/>\u003ctext x=\"610\" y=\"288\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"27\" fill=\"#102f35\" font-weight=\"700\" text-anchor=\"start\">Request 2 copies\u003c/text>\u003ctext x=\"30\" y=\"350\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"30\" fill=\"#287d71\" font-weight=\"700\" text-anchor=\"start\">Base currency: 2 × RecommendedPrice 42 = 84\u003c/text>\u003ctext x=\"30\" y=\"397\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#102f35\" font-weight=\"400\" text-anchor=\"start\">Counterexample: 2 owned − 1 demanded = 1 surplus. The threshold fails.\u003c/text>\u003c/svg>", "caption": "Normal Price is 54, but this baseline uses RecommendedPrice 42. Its slot does not add the computed DiffScore to the normal-slot accumulator. Baseline’s separate 60-second gate still applies."}}, {"title": "Supported fields without default ranges", "tag": "Parameter reference", "rows": [], "table": {"headers": ["#", "Parameter", "Default-file evidence", "Supported behavior"], "rows": [["1", "DynamicFirstMax / DynamicSecondMax / DynamicThirdMax", "Absent", "Requires DynamicMax > normal Max. No observed range established."], ["2", "sMonthPay / eMonthPay", "Absent", "Inclusive payment bounds. Monetary unit and observed range remain unestablished."], ["3", "LuckyTriggerChance", "Absent", "Compare a random draw with the value. Conceptual probability domain 0–1, but no clamp is present."]]}, "takeaway": "Runtime support does not prove activation. A missing default value cannot supply a verified tuning range.", "note": "LuckyTriggerChance is tested as randomNum \u003c= configured chance in MainOrderModel. A 0–1 domain follows its intended probability interpretation, not a validated schema. Dynamic ceilings and monthly payment bounds likewise lack observed values in the unsuffixed random table.", "src": "core/Board/Model/Order/MainOrderModel.lua:548; core/Board/Model/Order/MainOrderCreatorRandom.lua:284,699; base/Common/Utility/MathUtil.lua:23"}, {"title": "Configuration can change the same code", "tag": "Configuration", "rows": [["Local tables", "OrderItemConfig, OrderRandomConfig, item-count, avatar and specialist tables provide bundled data."], ["Replacement selection", "The cached fileReplace key can map a filename to a suffixed configuration variant."], ["General flags", "general_conf_new rows supply named parameters and switches. Their effect depends on the client’s consuming code."]], "note": "ConfigModel stores server JSON in the config table. GetServerConfig returns the wrapper config field. GetReplacesFilePath appends the selected suffix, and the require path uses it. A cached selector can differ temporarily from loaded tables if a restart is required. A variant file’s presence alone does not prove activation.", "src": "core/Model/ConfigModel.lua:231,245,311,349,380,624; base/Main.lua:15"}, {"title": "A complete order walkthrough", "tag": "Recap", "rows": [["1–3  Entry", "A slot becomes available. Creator priority selects a path. Allowance and cooldown checks permit creation."], ["4–6  Selection", "A player-state filter supplies ranges. Eligible candidates receive context and history weights. Sequential draws select candidates and count."], ["7–9  Completion", "The client assigns a customer and saves. Delivery handles rewards and exact items. History updates affect the next fill attempt."]], "note": "Use the sequence to locate a cause: entry gates, configuration matching, candidate eligibility, weight adjustment, count selection, saving or completion feedback.", "src": "core/Board/Model/Order/SlotOrderModel.lua; core/Board/Model/Order/MainOrderCreatorRandom.lua; core/Board/Model/Board/MainBoardModel.lua"}, {"title": "Questions to test understanding", "tag": "Team exercise", "rows": [["Same level, different orders?", "Compare inventory, active requests, completed difficulty, saved history and applicable configuration."], ["Three candidates, two requested?", "Candidate selection happens before the separate request-count draw."], ["Higher reward, harder next order?", "Price and DiffScore are separate. Check both values and whether the completed order uses a normal slot."], ["Empty slot after delivery?", "Check creator gates, allowance, cooldown and candidate availability."]], "note": "These are diagnostic prompts. They do not claim one cause for all occurrences. Let participants name the required state before revealing or discussing each explanation.", "src": "Source synthesis of the normal-order pipeline"}, {"title": "How to read this tutorial", "tag": "Evidence", "rows": [["Client rules", "Behavior confirmed in the extracted client source."], ["Bundled defaults", "Observed bundled values are not universal allowed ranges. Runtime checks and recommended authoring constraints are identified separately."], ["Cached observation", "A separate emulator snapshot supplies historical settings. Its installed build differs from the inspected source."], ["Teaching examples", "Explicit assumptions explain calculations. These are not observed player orders."]], "note": "The main presentation explains the normal-order pipeline. Special creators are mapped, but their full event logic has not been reverse-documented. The cache belongs to a different build and does not establish current settings for all accounts.", "src": "00_metadata/xapk_manifest.json; Nox order-config-observation.json"}, {"title": "Topic index", "tag": "Reference", "rows": [["01  Order structure", "Slots, order types, item parameters and player state."], ["02  Generation", "Creator priority, refill limits, filters, weights and request count."], ["03  Completion", "Customer assignment, saving, delivery, rewards and feedback."], ["04  Configuration", "Special paths, Nox findings, worked examples and remaining gaps."]], "note": "Reference index for the topics covered in the presentation.", "src": "core/Board/Model/Order/MainOrderModel.lua"}, {"title": "Cached configuration findings", "tag": "Reference: cached observation", "rows": [["Capture context", "Captured November 5, 2026. Database modified November 3. The installed build differs from the source used for the algorithm trace."], ["Recovered tables", "97 order-buff rows, Order Boost slot/item/reward tables and 42 Order Boost Pro reward rows."], ["Observed flag", "recall_order has param_int = 1. Other recovered order-related flags include bubble bonuses and the boost hint."]], "note": "The game was not opened or refreshed for this capture. All 256 encrypted pages authenticated and SQLite integrity_check returned ok. Counts describe cached records, not simultaneous active effects. Event dates, player gates and consuming cached build code still determine applicability.", "src": "Nox order-config-observation.json"}, {"title": "Cached configuration limitations", "tag": "Reference: evidence limits", "rows": [["No replacement selector", "No fileReplace entry appears in the captured config map. This does not independently identify every loaded table."], ["No dynamic-weight flag", "order_diff_dynamic is absent. The inspected source defaults it to off, but the cached build’s fallback behavior remains unverified."], ["No live refresh", "We have no current server response, no universal account configuration and no complete source comparison for the cached build."]], "note": "Avoid merging the cached build observation into inspected client source claims. Configuration could change on the next server sync. Absence claims refer only to the captured config map, not every file or possible server system.", "src": "Nox order-config-observation.json; core/Model/ConfigModel.lua"}, {"title": "Coverage and next investigation", "tag": "Reference: coverage", "rows": [["Established", "Normal-order rules, master/candidate/backup pools, item and filter parameters, worked boundaries, persistence and completion feedback."], ["Partially established", "Special creator interfaces and a historical server-configuration cache from a different build."], ["Still required for exact reproduction", "Source matching the cached build, a fresh configuration capture, full specialist rules, boundary checks and a known player-state snapshot."]], "note": "The tutorial supports understanding and design discussions. It is not a complete implementation specification or a prediction of the next live order. Asian Merge2 adoption choices should be documented separately rather than implied by this reference.", "src": "Source synthesis; Nox order-config-observation.json"}, {"title": "Source guide", "tag": "Reference", "rows": [["Generation", "MainOrderDefinition, MainOrderModel, SlotOrderModel and MainOrderCreatorRandom."], ["Parameters and rewards", "OrderItemConfig, OrderRandomConfig, OrderItemNumberWeightConfig, MainOrder and MainBoardModel."], ["Configuration evidence", "ConfigModel and the November 5 Nox order-config-observation.json. Full source locations appear in each slide’s notes."]], "note": "Client paths refer to the inspected source extraction. The emulator observation belongs to a different build. No game-server request was made during capture, and the full player database was not saved in plaintext. Parameter inventory scope:74 item records with 12 fields,9 random configuration types with 27 filter rows, and4 fallback count rows. Sources were read statically, not executed.", "src": "Source index"}]</script>
<script>
'use strict';
const deck=JSON.parse(document.getElementById('deck-data').textContent);
const root=document.getElementById('slides');let current=0;
const sourceRoot='Client source / 05_gameplay_logic/lua/readable/decompiled/';
const make=(tag,className,text)=>{const element=document.createElement(tag);if(className)element.className=className;if(text!==undefined)element.textContent=text;return element;};
deck.forEach((item,i)=>{const section=make('section','slide'+(i===0?' cover':''));section.setAttribute('aria-label',`Slide ${i+1}: ${item.title.replace('\n',' ')}`);section.append(make('p','tag',item.tag),make('h1','',item.title));if(i===0){section.append(make('p','subtitle','Order generation, selection and completion'),make('p','scope',''));}else{const rows=make('div','rows');item.rows.forEach(([label,body])=>{const row=make('div','row');row.append(make('h2','',label),make('p','',body));rows.append(row);});section.append(rows);
if(item.table && !item.visual){
 section.classList.add('data-slide');
 const table=make('table','parameter-table');
 const head=make('thead');const headerRow=make('tr');
 item.table.headers.forEach(label=>{const cell=make('th','',label);cell.scope='col';headerRow.append(cell);});
 head.append(headerRow);table.append(head);const body=make('tbody');
 item.table.rows.forEach(values=>{const row=make('tr');values.forEach((value,index)=>{const cell=make('td','',value);cell.dataset.label=item.table.headers[index];row.append(cell);});body.append(row);});
 table.append(body);section.append(table);
}
if(item.visual){
 section.classList.add('visual-slide');
 rows.hidden=true;
 const frame=make('figure','visual-frame');
 frame.innerHTML=item.visual.svg;
 const caption=make('figcaption','visual-caption',item.visual.caption);
 frame.append(caption);section.append(frame);
}else if(item.takeaway){
 section.append(make('p','takeaway',item.takeaway));
}
section.append(make('p','page',`${i+1} / ${deck.length}`));}root.append(section);const li=make('li');const button=make('button','',item.title.replace('\n',' · '));button.addEventListener('click',()=>{show(i);closeIndex();});li.append(button);document.getElementById('index-list').append(li);});
function show(index,updateHash=true){current=Math.max(0,Math.min(deck.length-1,index));[...root.children].forEach((node,i)=>node.hidden=i!==current);document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===deck.length-1;document.getElementById('position').textContent=`Slide ${current+1} of ${deck.length}`;document.getElementById('bar').style.width=`${(current+1)/deck.length*100}%`;document.getElementById('note-text').textContent=deck[current].note;document.getElementById('sources').textContent=deck[current].src?sourceRoot+'\n'+deck[current].src.replaceAll('; ','\n'):'Client source and the separately labelled cache observation. See the final reference section.';if(updateHash)history.replaceState(null,'',`#slide-${current+1}`);}
function toggleNotes(){const panel=document.getElementById('notes');panel.hidden=!panel.hidden;document.getElementById('notes-toggle').setAttribute('aria-expanded',String(!panel.hidden));}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('fullscreen').textContent='Use browser fullscreen';}}
function closeIndex(){document.getElementById('index').hidden=true;document.getElementById('contents').focus();}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('notes-toggle').onclick=toggleNotes;document.getElementById('fullscreen').onclick=fullscreen;document.getElementById('print').onclick=()=>window.print();document.getElementById('contents').onclick=()=>{document.getElementById('index').hidden=false;document.getElementById('close-index').focus();};document.getElementById('close-index').onclick=closeIndex;
document.getElementById('index').addEventListener('click',event=>{if(event.target.id==='index')closeIndex();});
document.addEventListener('keydown',event=>{const modal=document.getElementById('index');if(!modal.hidden){if(event.key==='Escape')closeIndex();if(event.key==='Tab'){const controls=[...modal.querySelectorAll('button')];const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}return;}if(event.altKey||event.ctrlKey||event.metaKey)return;if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(event.key))event.preventDefault();if(['ArrowRight','PageDown'].includes(event.key))show(current+1);if(['ArrowLeft','PageUp'].includes(event.key))show(current-1);if(event.key==='Home')show(0);if(event.key==='End')show(deck.length-1);if(event.key.toLowerCase()==='n')toggleNotes();if(event.key.toLowerCase()==='f')fullscreen();});
function fromHash(){const match=location.hash.match(/^#slide-(\d+)$/);show(match?Number(match[1])-1:0,false);}window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
